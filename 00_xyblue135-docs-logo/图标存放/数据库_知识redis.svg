<svg height="680" width="680" xmlns="http://www.w3.org/2000/svg" viewBox="0 -30 680 680" role="img">
  <title>Redis Stack Logo</title>
  <desc>Isometric 3D Redis Stack logo with star, circle, triangle, and rhombus shapes on three stacked layers</desc>

  <defs>
    <linearGradient id="topFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E74C3C"/>
      <stop offset="1" stop-color="#C0382B"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C0382B"/>
      <stop offset="1" stop-color="#8B1F18"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A82A20"/>
      <stop offset="1" stop-color="#6B140E"/>
    </linearGradient>
  </defs>

  <g transform="translate(340,310)">
    <!-- ============== BOTTOM LAYER ============== -->
    <g>
      <!-- left side -->
      <path d="M -260,40 L -260,100 L 0,230 L 0,170 Z" fill="url(#leftFace)"/>
      <!-- right side -->
      <path d="M 260,40 L 260,100 L 0,230 L 0,170 Z" fill="url(#rightFace)"/>
      <!-- top face -->
      <path d="M 0,-60 L 260,40 L 0,140 L -260,40 Z" fill="url(#topFace)"/>
    </g>

    <!-- ============== MIDDLE LAYER ============== -->
    <g transform="translate(0,-80)">
      <path d="M -260,40 L -260,100 L 0,230 L 0,170 Z" fill="url(#leftFace)"/>
      <path d="M 260,40 L 260,100 L 0,230 L 0,170 Z" fill="url(#rightFace)"/>
      <path d="M 0,-60 L 260,40 L 0,140 L -260,40 Z" fill="url(#topFace)"/>
    </g>

    <!-- ============== TOP LAYER ============== -->
    <g transform="translate(0,-160)">
      <!-- sides -->
      <path d="M -260,40 L -260,100 L 0,230 L 0,170 Z" fill="url(#leftFace)"/>
      <path d="M 260,40 L 260,100 L 0,230 L 0,170 Z" fill="url(#rightFace)"/>
      <!-- top face -->
      <path d="M 0,-60 L 260,40 L 0,140 L -260,40 Z" fill="url(#topFace)"/>

      <!-- shapes on top face -->
      <!-- Star (top center) -->
      <g transform="translate(0,5)">
        <path d="M 0,-50 L 12,-15 L 50,-15 L 20,8 L 32,45 L 0,22 L -32,45 L -20,8 L -50,-15 L -12,-15 Z" fill="#FFFFFF"/>
      </g>

      <!-- Circle (left) -->
      <ellipse cx="-110" cy="35" rx="40" ry="24" fill="#FFFFFF"/>

      <!-- Triangle (bottom) -->
      <g transform="translate(50,75)">
        <path d="M 0,-30 L 40,30 L -40,30 Z" fill="#FFFFFF"/>
      </g>

      <!-- Dark rhombus (right) -->
      <g transform="translate(130,15)">
        <path d="M 0,-30 L 50,0 L 0,30 L -50,0 Z" fill="#8B1F18"/>
        <!-- folded triangle on the rhombus -->
        <path d="M 0,-30 L 0,0 L 50,0 Z" fill="#6B140E"/>
      </g>
    </g>
  </g>
</svg>
